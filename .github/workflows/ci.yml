name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunar-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src-repo

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Windows'
        run: New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE | Out-Null
        shell: pwsh
        working-directory: .
      - uses: actions/checkout@v4
        with:
          path: src-repo
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev
      - run: cargo fmt --all && cargo fmt --check
      - run: cargo check --all-targets
      - run: cargo test
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build --release

  artifacts:
    if: github.event_name != 'pull_request'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: LUNAR-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: LUNAR-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Windows'
        run: New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE | Out-Null
        shell: pwsh
        working-directory: .
      - uses: actions/checkout@v4
        with:
          path: src-repo
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev
      - run: cargo build --release --target ${{ matrix.target }}
      - if: runner.os == 'Windows'
        run: Copy-Item "target/${{ matrix.target }}/release/lunar.exe" "../${{ matrix.archive }}"
        shell: pwsh
      - if: runner.os == 'Linux'
        run: cp "target/${{ matrix.target }}/release/lunar" "../${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: lunar-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: lunar-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Windows'
        run: New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE | Out-Null
        shell: pwsh
        working-directory: .
      - uses: actions/checkout@v4
        with:
          path: src-repo
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev
      - run: cargo build --release --target ${{ matrix.target }}
      - if: runner.os == 'Windows'
        run: Copy-Item "target/${{ matrix.target }}/release/lunar.exe" "../${{ matrix.archive }}"
        shell: pwsh
      - if: runner.os == 'Linux'
        run: cp "target/${{ matrix.target }}/release/lunar" "../${{ matrix.archive }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
