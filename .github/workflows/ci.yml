name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunar-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src-repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src-repo
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libdbus-1-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo test
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build --release

  artifacts:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src-repo
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 binutils-mingw-w64-x86-64 libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libdbus-1-dev pkg-config
      - run: cargo build --release
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - run: cp target/release/lunar ../Lunar-Launcher-linux-x64
      - run: cp target/x86_64-pc-windows-gnu/release/lunar.exe ../Lunar-Launcher-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Lunar-Launcher-Linux
          path: Lunar-Launcher-linux-x64
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Lunar-Launcher-Windows
          path: Lunar-Launcher-Windows-x64.exe
          retention-days: 14
