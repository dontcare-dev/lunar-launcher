name: Nyx Client

on:
  push:
    branches: [main]
    paths:
      - "nyx-client/**"
      - "nyx-client-modern/**"
      - ".github/workflows/nyx-client.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nyx-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.20.1"
            mappings: "1.20.1+build.10"
            java: "17"
          - minecraft: "1.21.1"
            mappings: "1.21.1+build.3"
            java: "21"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build Nyx Client
        working-directory: nyx-client
        run: gradle build --no-daemon -Pminecraft_version=${{ matrix.minecraft }} -Pyarn_mappings=${{ matrix.mappings }} -Pjava_version=${{ matrix.java }}
      - name: Upload version-specific client
        uses: actions/upload-artifact@v4
        with:
          name: nyx-client-${{ matrix.minecraft }}
          path: nyx-client/build/libs/*.jar
          if-no-files-found: error

  build-modern:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.1", "26.1.1", "26.1.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Build Nyx Client for Minecraft ${{ matrix.minecraft }}
        working-directory: nyx-client-modern
        run: gradle build --no-daemon -Pminecraft_version=${{ matrix.minecraft }}
      - name: Upload modern client
        uses: actions/upload-artifact@v4
        with:
          name: nyx-client-${{ matrix.minecraft }}
          path: nyx-client-modern/build/libs/*.jar
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build, build-modern]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish installable clients
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nyx-client-build-${{ github.run_number }}
          name: Nyx Client Build #${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: release/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
