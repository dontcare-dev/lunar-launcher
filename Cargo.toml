[package]
name = "lunar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
crust_core = "1.0.3"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
md5 = "0.7"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
shlex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
directories = "6"
egui_extras = { version = "0.31", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp"] }
sysinfo = "0.33"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
winres = "0.1"
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
