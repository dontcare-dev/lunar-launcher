plugins {
    id "net.fabricmc.fabric-loom" version "1.19-SNAPSHOT"
}
version = project.mod_version
group = project.maven_group
base { archivesName = "nyx-client-${project.minecraft_version}" }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}
loom {
    splitEnvironmentSourceSets()
    mods {
        "nyxclient" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
def modVersion = project.version.toString()
def minecraftVersion = project.property("minecraft_version").toString()

processResources {
    inputs.property "version", modVersion
    inputs.property "minecraft_version", minecraftVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion, "minecraft_version": minecraftVersion
    }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
